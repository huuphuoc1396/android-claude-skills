<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the skills work together</title>
  <desc>scout and rulebook run once per repo. spark, mold, slice, blueprint and forge run per feature, or all at once through foundry. When the requirement or design changes, the update chain runs again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="470" rx="12" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="12" fill="#5F5E5A">Once per repo</text>
  <rect x="40" y="44" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="115" y="66" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">scout</text>
  <text x="115" y="86" font-size="12" fill="#534AB7" text-anchor="middle">CLAUDE.md</text>
  <rect x="250" y="44" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="325" y="66" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">rulebook</text>
  <text x="325" y="86" font-size="12" fill="#534AB7" text-anchor="middle">.claude/rules/</text>
  <line x1="190" y1="72" x2="246" y2="72" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="325" y1="100" x2="325" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="28" y="140" width="624" height="176" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="44" y="164" font-size="14" font-weight="500" fill="#2C2C2A">Per feature (foundry runs the whole chain)</text>

  <rect x="40" y="182" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="92" y="204" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">spark</text>
  <text x="92" y="224" font-size="12" fill="#0F6E56" text-anchor="middle">task.md</text>

  <rect x="166" y="182" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="218" y="204" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">mold</text>
  <text x="218" y="224" font-size="12" fill="#5F5E5A" text-anchor="middle">design.md</text>

  <rect x="292" y="182" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="344" y="204" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">slice</text>
  <text x="344" y="224" font-size="12" fill="#5F5E5A" text-anchor="middle">subtasks/NN</text>

  <rect x="418" y="182" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="470" y="204" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">blueprint</text>
  <text x="470" y="224" font-size="12" fill="#0F6E56" text-anchor="middle">implement plan</text>

  <rect x="544" y="182" width="96" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="592" y="204" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">forge</text>
  <text x="592" y="224" font-size="12" fill="#0F6E56" text-anchor="middle">code + tests</text>

  <line x1="144" y1="210" x2="164" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="210" x2="290" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="396" y1="210" x2="416" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="522" y1="210" x2="542" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="218" y="260" font-size="12" fill="#5F5E5A" text-anchor="middle">optional: a design exists</text>
  <text x="344" y="278" font-size="12" fill="#5F5E5A" text-anchor="middle">optional: large task</text>
  <text x="520" y="260" font-size="12" fill="#5F5E5A" text-anchor="middle">blueprint + forge repeat per subtask</text>
  <text x="44" y="302" font-size="12" fill="#5F5E5A">Auto mode follows recommendations and asks only when needed; Interactive mode asks at every stage.</text>

  <line x1="340" y1="316" x2="340" y2="346" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="350" width="600" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="340" y="372" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">When the requirement or design changes</text>
  <text x="340" y="392" font-size="12" fill="#993C1D" text-anchor="middle">spark / mold update → slice update → blueprint update → forge resumes at the first unticked step</text>

  <rect x="40" y="428" width="22" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="70" y="439" font-size="12" fill="#5F5E5A">always runs</text>
  <rect x="160" y="428" width="22" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="190" y="439" font-size="12" fill="#5F5E5A">optional</text>
  <rect x="260" y="428" width="22" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="290" y="439" font-size="12" fill="#5F5E5A">once per repo</text>
  <rect x="400" y="428" width="22" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="430" y="439" font-size="12" fill="#5F5E5A">update path</text>
</svg>
